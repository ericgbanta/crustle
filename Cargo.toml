[package]
name = "crustle"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7.10", features = ["web", "router"] }
futures-util = { version = "0.3", default-features = false }
pokemon-rs = "1.7.0"
# Not used directly: pokemon-rs 1.7 -> rand 0.8 -> getrandom 0.2, which only builds for
# wasm32-unknown-unknown with its "js" feature enabled.
getrandom = { version = "0.2", features = ["js"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
